name: New Tech TV Recovery Professional Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Recovery signing key
        env:
          RECOVERY_KEYSTORE_BASE64: ${{ secrets.RECOVERY_KEYSTORE_BASE64 }}
        run: |
          echo "$RECOVERY_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks

      - name: Build signed Release APK
        working-directory: android
        env:
          RECOVERY_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release-key.jks
          RECOVERY_KEYSTORE_PASSWORD: ${{ secrets.RECOVERY_KEYSTORE_PASSWORD }}
          RECOVERY_KEY_ALIAS: ${{ secrets.RECOVERY_KEY_ALIAS }}
          RECOVERY_KEY_PASSWORD: ${{ secrets.RECOVERY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload Professional APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTech-TV-Recovery-Professional
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f android/app/release-key.jks
